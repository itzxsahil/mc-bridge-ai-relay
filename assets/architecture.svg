<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="100%" height="270">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2EA043" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#388BFD" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="270" rx="16" fill="url(#bgGrad)" stroke="#30363D" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <rect x="25" y="20" width="8" height="28" rx="4" fill="#2EA043" />
  <text x="45" y="40" fill="#FFFFFF" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="bold">Minecraft Bridge AI Relay Architecture</text>
  <text x="45" y="60" fill="#8B949E" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">Node.js WebSocket Relay • Ultra Low Latency</text>

  <!-- Decorative Badge -->
  <rect x="760" y="24" width="115" height="24" rx="12" fill="#21262D" stroke="#2EA043" stroke-width="1"/>
  <text x="817" y="40" fill="#2EA043" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">LIVE PROTOCOL</text>

  <!-- Architecture Flow Nodes -->
  
        
        <g transform="translate(50, 120)">
          <rect width="185" height="100" rx="12" fill="#161B22" stroke="#2EA043" stroke-width="2" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))"/>
          <circle cx="24" cy="28" r="8" fill="#2EA043" />
          <text x="40" y="33" fill="#F0F6FC" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold">Minecraft Server</text>
          <rect x="15" y="55" width="155" height="1" fill="#30363D"/>
          <text x="15" y="76" fill="#8B949E" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">In-Game Chat & Event Hooks</text>
        </g>
        
        
        <g>
          <line x1="235" y1="170" x2="255" y2="170" stroke="#2EA043" stroke-width="2.5" stroke-dasharray="4,4" />
          <polygon points="255,166 262,170 255,174" fill="#2EA043" />
        </g>
        
        <g transform="translate(260, 120)">
          <rect width="185" height="100" rx="12" fill="#161B22" stroke="#339933" stroke-width="2" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))"/>
          <circle cx="24" cy="28" r="8" fill="#339933" />
          <text x="40" y="33" fill="#F0F6FC" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold">Node.js Relay</text>
          <rect x="15" y="55" width="155" height="1" fill="#30363D"/>
          <text x="15" y="76" fill="#8B949E" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">ws WebSocket Hub (server.js)</text>
        </g>
        
        
        <g>
          <line x1="445" y1="170" x2="465" y2="170" stroke="#2EA043" stroke-width="2.5" stroke-dasharray="4,4" />
          <polygon points="465,166 472,170 465,174" fill="#2EA043" />
        </g>
        
        <g transform="translate(470, 120)">
          <rect width="185" height="100" rx="12" fill="#161B22" stroke="#00B4D8" stroke-width="2" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))"/>
          <circle cx="24" cy="28" r="8" fill="#00B4D8" />
          <text x="40" y="33" fill="#F0F6FC" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold">AI Agent</text>
          <rect x="15" y="55" width="155" height="1" fill="#30363D"/>
          <text x="15" y="76" fill="#8B949E" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Bi-Directional Action Stream</text>
        </g>
        
        
        <g>
          <line x1="655" y1="170" x2="675" y2="170" stroke="#2EA043" stroke-width="2.5" stroke-dasharray="4,4" />
          <polygon points="675,166 682,170 675,174" fill="#2EA043" />
        </g>
        
        <g transform="translate(680, 120)">
          <rect width="185" height="100" rx="12" fill="#161B22" stroke="#FF9E00" stroke-width="2" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))"/>
          <circle cx="24" cy="28" r="8" fill="#FF9E00" />
          <text x="40" y="33" fill="#F0F6FC" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold">Game World</text>
          <rect x="15" y="55" width="155" height="1" fill="#30363D"/>
          <text x="15" y="76" fill="#8B949E" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Instant In-Game Responses</text>
        </g>
        
</svg>
